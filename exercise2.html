

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login/register</title>
</head>
<body>
    <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login Page</title>
  <style>
     body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Arial', sans-serif;
      overflow: hidden;
    }

    .bg-img {
      background-image: url('https://img.freepik.com/free-photo/arrangement-black-friday-shopping-carts-with-copy-space_23-2148667047.jpg?semt=ais_hybrid&w=740&q=80');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      color: rgb(209, 195, 195);
    }

    .bg-img::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(0, 0, 0, 0.5);
      z-index: 1;
    }

    .form-container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 400px;
      padding: 30px;
      background-color: rgba(14, 14, 14, 0);
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0);
    }

    .form-container h2 {
      text-align: center;
      color: #e63946;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      color: #fcfbfb;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #e3d6d6;
      border-radius: 6px;
      font-size: 16px;
    }

    .btn {
      width: 100%;
      padding: 12px;
      background-color: #e6394700;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }

    .btn:hover {
      background-color: #c1121f;
    }

    .toggle {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
    }

    .toggle a {
      color: #e63946;
      text-decoration: none;
    }

    .toggle a:hover {
      text-decoration: underline;
    }
    .h1{
      color: rgba(244, 236, 236, 0.523);
      height: 35px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
  </style>
</head>
<body>
  

  <div class="bg-img">
    <div class="form-container">
      <!-- Login Form -->
       <form class="h1">
        <h1>PARCEL.in</h1>
       </form>
      <form id="loginForm">
        <h2>Login</h2>
        <div class="form-group">
          <label for="loginEmail">Email</label>
          <input type="email" id="loginEmail" name="email" required />
        </div>
        <div class="form-group">
          <label for="loginPass">Password</label>
          <input type="password" id="loginPass" name="password" required />
        </div>
        <button type="submit" class="btn">Login</button>
        <div class="toggle">
          Don't have an account? <a href="#" onclick="showRegister()">Register</a>
        </div>
      </form>

      <!-- Register Form (Hidden by default) -->
      <form id="registerForm" style="display: none;">
        <h2>Register</h2>
        <div class="form-group">
          <label for="regName">Full Name</label>
          <input type="text" id="regName" name="name" required />
        </div>
        <div class="form-group">
          <label for="regEmail">Email</label>
          <input type="email" id="regEmail" name="email" required />
        </div>
        <div class="form-group">
          <label for="regPass">Password</label>
          <input type="password" id="regPass" name="password" required />
        </div>
        <button type="submit" class="btn">Register</button>
        <div class="toggle">
          Already have an account? <a href="#" onclick="showLogin()">Login</a>
        </div>
      </form>
    </div>
  </div>

  <script>
    function showRegister() {
      document.getElementById('loginForm').style.display = 'none';
      document.getElementById('registerForm').style.display = 'block';
    }

    function showLogin() {
      document.getElementById('registerForm').style.display = 'none';
      document.getElementById('loginForm').style.display = 'block';
    }
  </script>
</body>
</html>   
    
</body>
</html>
